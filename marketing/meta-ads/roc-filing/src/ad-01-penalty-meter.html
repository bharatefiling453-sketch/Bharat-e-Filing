<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#0B0F14;font-family:Inter,sans-serif;color:#F4F6F8;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(120px)}
.g1{width:620px;height:620px;background:#ff3b3b;opacity:.28;right:-140px;top:420px}
.g2{width:560px;height:560px;background:#19e3a3;opacity:.18;left:-160px;top:120px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:54px 54px}
.wrap{position:absolute;inset:0;padding:96px 92px;display:flex;flex-direction:column}
.eyebrow{font-weight:600;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#8A96A3}
h1{font-weight:800;font-size:82px;line-height:1.02;letter-spacing:-.035em;margin-top:22px}
h1 span{color:#FF5A5A}
.card{margin-top:58px;border-radius:40px;padding:46px 50px 40px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(20px)}
.row{display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:26px;font-weight:600;color:#B9C3CC}
.live{display:flex;align-items:center;gap:12px;font-family:'JetBrains Mono';font-size:22px;font-weight:700;color:#FF6B6B;background:rgba(255,90,90,.12);padding:10px 18px;border-radius:999px}
.dot{width:14px;height:14px;border-radius:50%;background:#FF4D4D;box-shadow:0 0 0 6px rgba(255,77,77,.25)}
.num{font-family:'JetBrains Mono';font-weight:800;font-size:150px;letter-spacing:-.04em;margin-top:18px;line-height:1;font-variant-numeric:tabular-nums}
.num small{font-size:84px;color:#8A96A3;margin-right:10px}
.digit{display:inline-block;background:rgba(0,0,0,.35);border-radius:14px;padding:0 6px;margin:0 2px}
svg{display:block;margin-top:26px}
.meta{display:flex;justify-content:space-between;margin-top:14px;font-family:'JetBrains Mono';font-size:20px;color:#6E7A86}
.sub{margin-top:46px;font-size:34px;line-height:1.35;color:#C9D1D9;font-weight:500}
.sub b{color:#fff;font-weight:700}
.cta{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.btn{background:#19E3A3;color:#04140E;font-weight:800;font-size:34px;padding:28px 44px;border-radius:999px;letter-spacing:-.01em}
.brand{text-align:right;font-size:22px;color:#8A96A3;line-height:1.4}
.brand b{display:block;color:#fff;font-size:30px;font-weight:800;letter-spacing:-.02em}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
<div class="wrap">
  <div class="eyebrow">ROC filing pending?</div>
  <h1>Yeh meter roz<br><span>₹100</span> badhta hai.</h1>
  <div class="card">
    <div class="row"><div class="lbl">AOC-4 late fee · 180 din late</div><div class="live"><div class="dot"></div>+₹100/din</div></div>
    <div class="num"><small>₹</small><span class="digit">1</span><span class="digit">8</span>,<span class="digit">0</span><span class="digit">0</span><span class="digit">0</span></div>
    <svg width="776" height="150" viewBox="0 0 776 150"><defs><linearGradient id="a" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF5A5A" stop-opacity=".45"/><stop offset="1" stop-color="#FF5A5A" stop-opacity="0"/></linearGradient></defs>
      <path d="M0 140 L770 10 L776 10 L776 150 L0 150Z" fill="url(#a)"/>
      <path d="M0 140 L768 12" fill="none" stroke="#FF5A5A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="766" cy="12" r="9" fill="#FF5A5A"/></svg>
    <div class="meta"><span>Day 1</span><span>Day 90</span><span>Day 180 →</span></div>
  </div>
  <div class="sub">AOC-4, MGT-7, LLP Form 8 — <b>har form par alag. Koi upper limit nahi.</b></div>
  <div class="cta">
    <div class="btn">Free penalty check →</div>
    <div class="brand"><b>Bharat eFiling</b>11+ yrs · CA &amp; CS team</div>
  </div>
</div>
</body></html>
