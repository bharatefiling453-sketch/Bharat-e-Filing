<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#F1EEE6;color:#0E0E0E;font-family:Inter,sans-serif;position:relative}
.noise{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(0,0,0,.08) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:absolute;inset:64px 72px}
.hdr{display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-bottom:3px solid #0E0E0E;padding-bottom:16px}
h1{font-family:'Archivo Black';font-size:260px;line-height:.86;letter-spacing:-.06em;margin-top:40px}
h1 em{font-style:normal;color:#FF4D1A}
.rule{border-top:3px solid #0E0E0E;margin-top:44px}
.item{display:grid;grid-template-columns:110px 1fr auto;align-items:baseline;padding:30px 0;border-bottom:1.5px solid #0E0E0E}
.idx{font-family:'JetBrains Mono';font-size:30px;font-weight:800}
.what{font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.what small{display:block;font-size:30px;font-weight:500;letter-spacing:-.01em;margin-top:10px;color:#3a3a3a}
.due{font-family:'JetBrains Mono';font-size:30px;font-weight:800;text-align:right}
.due.r{color:#FF4D1A}
.block{position:absolute;left:0;right:0;bottom:0;background:#FF4D1A;color:#0E0E0E;padding:40px 44px;display:flex;justify-content:space-between;align-items:flex-end}
.block .big{font-size:56px;font-weight:900;letter-spacing:-.035em;line-height:1}
.block .sm{font-size:24px;font-weight:600;margin-top:16px}
.block{gap:30px}
.seal{position:absolute;right:20px;top:190px;width:250px;height:250px;border-radius:50%;background:#0E0E0E;color:#F1EEE6;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(12deg);font-family:'JetBrains Mono';font-weight:800;text-align:center}
.seal b{font-family:'Archivo Black';font-size:62px;color:#FF4D1A;line-height:1}
.seal span{font-size:20px;letter-spacing:.12em;margin-top:6px}
.block .btn{background:#0E0E0E;color:#F1EEE6;font-weight:800;font-size:28px;padding:22px 30px;white-space:nowrap}
</style></head><body>
<div class="noise"></div>
<div class="wrap">
  <div class="hdr"><span>ROC / LLP Compliance</span><span>FY 2025–26</span></div>
  <div class="seal"><span>LATE FEE</span><b>₹100</b><span>PER DIN</span></div>
  <h1>LLP<br>hai<em>?</em></h1>
  <div class="rule"></div>
  <div class="item"><div class="idx">01</div><div class="what">Form 8<small>Statement of Accounts &amp; Solvency</small></div><div class="due">DUE<br>30 OCT</div></div>
  <div class="item"><div class="idx">02</div><div class="what">Form 11 miss kiya?<small>Late fee already chal rahi hai: ₹100/din</small></div><div class="due r">LATE<br>ALREADY</div></div>
  <div class="block">
    <div><div class="big">Dono ek saath file.<br>Fixed fee.</div><div class="sm">Bharat eFiling · CA &amp; CS team · 11+ yrs</div></div>
    <div class="btn">Free LLPIN check →</div>
  </div>
</div>
</body></html>
