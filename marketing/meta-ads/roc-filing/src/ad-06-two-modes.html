<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:'Space Grotesk',Inter,sans-serif;position:relative}
.half{position:absolute;left:0;right:0;height:675px;overflow:hidden}
.a{top:0;background:linear-gradient(180deg,#5D6178,#7B7F96)}
.b{bottom:0;background:linear-gradient(180deg,#FFD9B8,#FFC59A)}
.lbl{position:absolute;left:64px;top:56px;font-family:'JetBrains Mono';font-weight:800;font-size:24px;letter-spacing:.14em;text-transform:uppercase;padding:12px 20px;border-radius:999px}
.a .lbl{background:rgba(0,0,0,.25);color:#E7E8F0}
.b .lbl{top:auto;bottom:56px;background:#1D1D1D;color:#FFD9B8}
.emo{position:absolute;font-family:'Noto Color Emoji';line-height:1}
.face{font-size:260px;left:50%;transform:translateX(-50%)}
.a .face{top:120px;filter:saturate(.85)}
.b .face{top:210px}
.tag{position:absolute;font-weight:700;font-size:30px;padding:14px 22px;border-radius:16px;white-space:nowrap}
.a .tag{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.25)}
.b .tag{background:#fff;color:#1D1D1D;box-shadow:0 10px 24px rgba(160,80,20,.18)}
.band{position:absolute;left:-20px;right:-20px;top:590px;height:170px;background:#111;transform:rotate(-3deg);display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.band h1{color:#fff;font-size:76px;font-weight:700;letter-spacing:-.04em}
.band h1 span{color:#FFB37A}
.cta{position:absolute;right:64px;bottom:52px;background:#1D1D1D;color:#fff;font-weight:700;font-size:30px;padding:22px 32px;border-radius:999px;font-family:Inter}
.brand{position:absolute;right:64px;bottom:140px;font-family:Inter;font-weight:800;font-size:26px;color:#1D1D1D}
</style></head><body>
<div class="half a">
  <div class="lbl">ROC ignore mode</div>
  <div class="emo face">😰</div>
  <div class="emo" style="font-size:110px;left:150px;top:150px">🌧️</div>
  <div class="emo" style="font-size:90px;right:170px;top:120px;transform:rotate(14deg)">📄</div>
  <div class="emo" style="font-size:70px;right:120px;top:300px;transform:rotate(-12deg)">📄</div>
  <div class="tag" style="left:64px;top:340px;transform:rotate(-4deg)">₹100/din late fee</div>
  <div class="tag" style="right:64px;top:420px;transform:rotate(3deg)">Director disqualify?</div>
  <div class="tag" style="left:110px;top:460px;transform:rotate(2deg)">Strike-off?</div>
</div>
<div class="band"><h1>Same company. <span>Alag neend.</span></h1></div>
<div class="half b">
  <div class="emo face">😌</div>
  <div class="emo" style="font-size:110px;left:170px;top:230px">☕</div>
  <div class="emo" style="font-size:100px;right:190px;top:220px">✅</div>
  <div class="tag" style="right:110px;top:470px;transform:rotate(2deg)">Filed on time</div>
  <div class="tag" style="left:80px;top:380px;transform:rotate(3deg)">Fixed fee</div>
  <div class="tag" style="right:64px;top:380px;transform:rotate(-3deg)">CA &amp; CS · 11+ yrs</div>
  <div class="lbl">Bharat eFiling mode</div>
</div>
<div class="cta">Switch karein → Free ROC check</div>
</body></html>
